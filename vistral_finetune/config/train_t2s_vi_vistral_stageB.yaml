# Generated from config/train_t2s_vi.yaml by vistral_finetune (see PLAN.md). Edit data paths as needed.
# Stage B: full T2S fine-tune, identical recipe to the Mistral baseline; starts from the Stage A export.
log_dir: logs/t2s_vi_vistral_stageB
seed: 42
paths:
  tokenizer_path: vistral_finetune/tokenizer
  w2v_bert_path: facebook/w2v-bert-2.0
  w2v_stat: ./checkpoints/wav2vec2bert_stats.pt
  t2s_checkpoint: checkpoints/t2s_model_vistral_stageA.safetensors
data:
  train_data_path:
  - data/vi_podcast_Confucius4_TTS/train.tsv
  val_data_path:
  - data/vi_podcast_Confucius4_TTS/val.tsv
  batch_size: 4
  num_workers: 4
  sample_rate: 16000
t2s_model:
  num_layers: 24
  model_dim: 1280
  num_heads: 20
  max_text_seq_lens: 520
  max_semantic_seq_lens: 1520
  vocab_size: 38369
  semantic_vocab_size: 8194
  text_embedding_dim: 4096
  speaker_embedding_dim: 1024
  start_semantic_token: 8192
  stop_semantic_token: 8193
training:
  precision: 16-mixed
  epochs: 20
  gradient_clip: 1.0
  accumulate_grad_batches: 4
  val_check_interval: 200
  limit_val_batches: 10
  save_every_n_steps: 500
  log_every_n_steps: 10
  benchmark: true
optimizer:
  optimizer_type: adamw
  learning_rate: 3.0e-05
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
scheduler:
  scheduler_type: cosine
  num_warmup_steps: 200
  num_training_steps: 10000
