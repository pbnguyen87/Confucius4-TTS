# Fine-tune S2A (flow matching) on Vietnamese data built by scripts/prepare_confucius_data.py
# Copy of config/train_s2a.yaml with data paths and fine-tuning hyper-parameters changed.
# Run only after T2S fine-tuning if audio quality (not pronunciation) still needs work.
log_dir: logs/s2a_vi_podcast

seed: 42

paths:
  tokenizer_path: ./checkpoints
  w2v_bert_path: facebook/w2v-bert-2.0
  w2v_stat: ./checkpoints/wav2vec2bert_stats.pt
  t2s_checkpoint: ./checkpoints/t2s_model.safetensors   # frozen; point to your fine-tuned T2S if you have one
  s2a_checkpoint: ./checkpoints/s2a_model.pt            # resume from pretrained S2A

  style_encoder:
    target: external.campplus.CAMPPlus
    init_args:
      feat_dim: 80
      embedding_size: 192
    checkpoint: ./pretrained/campplus/campplus_cn_common.bin

data:
  train_data_path:
    - ./data/vi_podcast_Confucius4_TTS/train.tsv
  val_data_path:
    - ./data/vi_podcast_Confucius4_TTS/val.tsv
  batch_size: 4
  num_workers: 4
  max_text_seq_len: 520
  max_semantic_seq_len: 1520
  semantic_pad_token: 0
  target_sample_rate: 22050
  prompt_sample_rate: 16000

audio:
  n_fft: 1024
  win_length: 1024
  hop_length: 256
  n_mels: 80

t2s_model:
  num_layers: 24
  model_dim: 1280
  num_heads: 20
  max_text_seq_lens: 520
  max_semantic_seq_lens: 1520
  vocab_size: 32000
  semantic_vocab_size: 8194
  text_embedding_dim: 4096
  speaker_embedding_dim: 1024
  start_semantic_token: 8192
  stop_semantic_token: 8193

s2a_model:
  input_size: 512
  output_size: 80
  spk_embed_dim: 192
  semantic_embed_dim: 1024
  lm_latent_dim: 1280
  estimator_mlp_ratio: 3.0

training:
  precision: bf16-mixed
  epochs: 20
  gradient_clip: 1.0
  accumulate_grad_batches: 4
  val_check_interval: 200
  limit_val_batches: 10
  save_every_n_steps: 500
  log_every_n_steps: 10
  benchmark: true

optimizer:
  optimizer_type: adamw
  learning_rate: 2.0e-5               # pretrain default is 1e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  eps: 1.0e-8

scheduler:
  scheduler_type: cosine
  num_warmup_steps: 200
  num_training_steps: 10000
